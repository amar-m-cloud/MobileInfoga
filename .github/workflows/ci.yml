"""
GitHub Actions CI Pipeline for MobileInfoga.
"""

name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=mobileinfoga --cov-fail-under=80
      - name: Run linters
        run:
          ruff check . && black --check . && mypy mobileinfoga.py
      - name: Run formatters
        run: black mobileinfoga.py tests/ --check