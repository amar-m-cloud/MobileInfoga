[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobileinfoga"
version = "1.1.0"
description = "Phone number information gathering tool"
readme = "README.md"
license = {text = "GNU General Public License v3.0"}
authors = [
    {name = "Bineesh", email = "contact@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3.0",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "telethon>=1.34.0",
    "phonenumbers>=8.13.0",
    "mobile-codes>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mobileinfoga = "mobileinfoga.main:main"

[project.urls]
Homepage = "https://github.com/Bineesh627/MobileInfoga"
Source = "https://github.com/Bineesh627/MobileInfoga"